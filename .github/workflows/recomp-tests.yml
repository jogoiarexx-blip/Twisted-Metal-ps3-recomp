name: Recomp C++ tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recomp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run LV2 memory tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror lv2_memory_test.cpp -o /tmp/lv2_memory_test
          /tmp/lv2_memory_test

      - name: Build and run startup4 tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror startup4.cpp startup4_test.cpp -o /tmp/startup4_test
          /tmp/startup4_test

      - name: Build and run startup3 tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror startup3.cpp startup3_test.cpp -o /tmp/startup3_test
          /tmp/startup3_test

      - name: Build and run SPURS tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror spurs_hle_test.cpp -o /tmp/spurs_hle_test
          /tmp/spurs_hle_test

      - name: Build and run heap initialization tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror heap_init.cpp heap_init_test.cpp -o /tmp/heap_init_test
          /tmp/heap_init_test

      - name: Compile boot harness
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror entry.cpp startup2.cpp startup3.cpp startup4.cpp heap_init.cpp boot_probe.cpp -o /tmp/boot_probe
          # Requires the user's own EBOOT.elf for execution; CI only compiles.

      - name: Test MIT-licensed inflater candidate (synthetic only)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror ../integration/upstream/tm_inflate.cpp ../integration/upstream/tm_inflate_test.cpp -o /tmp/tm_inflate_test
          /tmp/tm_inflate_test

      - name: Test FranklinCG SPURS Taskset layout (synthetic only)
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror ../integration/upstream/franklin_taskset_probe.c -o /tmp/tm_taskset_probe
          /tmp/tm_taskset_probe

      - name: Check EBOOT target identity gate (no game files)
        run: |
          python3 -m unittest discover -s ../integration/upstream -p 'test_*.py' -v

  native-port-preflight:
    # Synthetic tests, no EBOOT or game binaries.
    name: Native preflight tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test native build gate
        run: python -m unittest discover -s integration/native -p "test_*.py" -v
